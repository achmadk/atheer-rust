[package]
name = "candle-coreml"
version = "0.3.1"
edition = "2021"
description = "CoreML inference engine for Candle tensors (vendored fork)"
license = "MIT OR Apache-2.0"
autoexamples = false
autotests = false

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
tokenizers = "0.23.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
dirs = "7.0.0"
half = "2"
tracing = "0.1"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-ml = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
# Used only by tests/ and examples/ (never by lib/bins); dev-deps keeps them
# available there while silencing unused_dependencies on default builds
candle-transformers = "0.11.0"
glob = "0.3"


