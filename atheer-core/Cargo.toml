[package]
name = "atheer-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
uniffi = { workspace = true }
memmap2 = { workspace = true }
tracing = { workspace = true }

uuid = { version = "1.26", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = "0.23.2"
rand = "0.10"
regex = "1"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = "3"
tempfile = "3.27"
aes-gcm = "0.11"
zeroize = { version = "1", features = ["zeroize_derive"] }
dirs = { version = "7.0", optional = true }
filetime = { version = "0.2", optional = true }
unicode-normalization = "0.1"
base64 = "0.23"
reqwest = { workspace = true, features = ["blocking", "rustls-tls"], optional = true }
atheer-memory-bank = { path = "../atheer-memory-bank", optional = true }
atheer-accel = { path = "../atheer-accel", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
webpki-roots = { version = "1.0", optional = true }
rustls-webpki = { version = "0.103", optional = true }

[features]
default = ["gguf-validator"]
auto-backend = ["atheer-accel"]
memory-bank = ["atheer-memory-bank"]
mmap = []
model-registry = ["dep:reqwest", "dep:rustls", "dep:webpki-roots", "dep:rustls-webpki", "dep:dirs", "dep:filetime"]
gguf-validator = []

[dev-dependencies]
