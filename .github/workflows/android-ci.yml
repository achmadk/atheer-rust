name: Android CI

# =============================================================================
# Vulkan Backend Note
# =============================================================================
# The candle-core Vulkan backend was reimplemented to use wgpu instead of raw ash.
# - wgpu provides a safer, higher-level API with built-in WGSL shader compilation
# - GPU compute is dispatched via compute pipelines, not CPU fallback
# - Full GPU verification requires physical Android device (emulator uses SwiftShader)
#
# Key changes:
# - candle-core/src/vulkan_backend_wgpu/ - new wgpu-backed implementation
# - Tests in candle-core/tests/vulkan_tests.rs verify correctness vs CPU reference
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'atheer-gpu-shard/**'
      - 'candle-core/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'atheer-gpu-shard/**'
      - 'candle-core/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
    inputs:
      run_instrumentation_tests:
        description: 'Run instrumentation tests in Android emulator'
        required: true
        default: false
        type: boolean
      emulator_api_level:
        description: 'Android API level for emulator'
        required: true
        default: '34'
        type: choice
        options:
          - '26'
          - '28'
          - '30'
          - '34'
          - '35'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Java & Android SDK ──────────────────────────────────────

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Install NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;30.0.16248370" \
            --sdk_root="$ANDROID_HOME"

      # ── Rust cross-compilation ──────────────────────────────────

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Restore Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile atheer-gpu-shard for arm64-v8a
        run: |
          cargo ndk \
            -t arm64-v8a \
            -o android/atheer-sdk/src/main/jniLibs \
            build -p atheer-gpu-shard --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724

      - name: Verify libatheer_gpu_shard.so was produced
        run: |
          ls -lh android/atheer-sdk/src/main/jniLibs/arm64-v8a/libatheer_gpu_shard.so

      # ── Gradle build ────────────────────────────────────────────

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: atheer-ffi-debug-apk
          path: android/atheer-sdk/build/outputs/apk/debug/atheer-sdk-debug.apk
          retention-days: 7

      - name: Upload GPU shard .so artifact
        uses: actions/upload-artifact@v6
        with:
          name: libatheer_gpu_shard-arm64-v8a
          path: android/atheer-sdk/src/main/jniLibs/arm64-v8a/libatheer_gpu_shard.so
          retention-days: 7

  candle-vulkan-build:
    name: Candle Vulkan Build (wgpu-backed)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Install NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;30.0.16248370" \
            --sdk_root="$ANDROID_HOME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Restore Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile candle-core with vulkan feature for arm64-v8a
        run: |
          cargo ndk \
            -t arm64-v8a \
            build -p candle-core --features vulkan --release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724

      - name: Verify candle-core with vulkan compiled
        run: |
          # Check for compiled library
          if ls target/aarch64-linux-android/release/libcandle_core.rlib 2>/dev/null; then
            echo "✓ libcandle_core.rlib found"
          elif ls target/aarch64-linux-android/release/deps/libcandle_core*.rlib 2>/dev/null; then
            echo "✓ libcandle_core dependencies found"
            ls target/aarch64-linux-android/release/deps/libcandle_core*.rlib | head -5
          else
            echo "Checking for compiled artifacts..."
            find target/aarch64-linux-android -name "libcandle*" -type f 2>/dev/null | head -10
            echo "Build may have succeeded but rlib naming differs"
          fi

  candle-vulkan-tests:
    name: Candle Vulkan Unit Tests (wgpu)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # NOTE: Emulator-based Vulkan testing has limitations
    # - SwiftShader (software renderer) emulates Vulkan, not real GPU
    # - Full GPU verification requires physical Android device with Vulkan
    # - Tests here verify compilation and basic API correctness against CPU reference
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Install NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;30.0.16248370" \
            --sdk_root="$ANDROID_HOME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Restore Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # ── Build test binary ───────────────────────────────────────

      - name: Build candle-vulkan-test binary for Android
        run: |
          # Build the test binary targeting Android
          cargo ndk \
            -t x86_64 \
            build -p candle-core --features vulkan \
            --tests --release 2>&1 | tail -30
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724

      - name: Find test binary
        run: |
          find target/x86_64-linux-android -name "candle_core*" -type f 2>/dev/null | head -20

      # ── KVM Permissions ─────────────────────────────────────────
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── Create Test Execution Script ─────────────────────────────

      - name: Generate emulator script
        run: |
          cat << 'EOF' > run_vulkan_tests.sh
          #!/usr/bin/env bash
          set -e

          echo "Waiting for device..."
          adb wait-for-device

          echo "Creating test data directory..."
          adb shell mkdir -p /data/local/tmp/candle-test
          adb shell chmod 777 /data/local/tmp/candle-test

          echo "Pushing test binary to device..."
          # Search specifically in release/deps and filter out metadata extensions (.d, .rlib, .rmeta, .so)
          TESTBIN=$(find target/x86_64-linux-android/release/deps -maxdepth 1 -type f -name "candle_core*" ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" ! -name "*.so" | head -1)

          if [ -n "$TESTBIN" ]; then
            echo "Found binary: $TESTBIN"
            adb push "$TESTBIN" /data/local/tmp/candle-test/candle_core_test
            adb shell chmod +x /data/local/tmp/candle-test/candle_core_test
          else
            echo "Test binary not found!"
            exit 1
          fi

          echo "Running Vulkan smoke test..."
          # Set working dir AND override TMPDIR to the writable tmp directory
          adb shell "cd /data/local/tmp/candle-test && TMPDIR=/data/local/tmp/candle-test ./candle_core_test --test-threads=1"

          echo "Testing ADB connectivity..."
          adb devices
          adb shell cat /proc/version 2>/dev/null || echo "proc/version not available"
          EOF

          chmod +x run_vulkan_tests.sh

      # ── Emulator ────────────────────────────────────────────────
      # WARNING: SwiftShader emulates Vulkan in software, not actual GPU execution.
      # The wgpu-based Vulkan backend will compile but real GPU dispatch
      # requires physical hardware. See candle-core/tests/vulkan_tests.rs for
      # tests that verify correctness against CPU reference.

      - uses: reactivecircus/android-emulator-runner@v2
        id: emulator
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd # <-- Lightweight target for fast CI booting
          profile: pixel_6 # <-- Gives a clean hardware configuration
          avd-name: candle-vulkan-test
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          disable-spellchecker: true
          script: ./run_vulkan_tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candle-vulkan-test-results
          path: |
            target/x86_64-linux-android/
            /tmp/candle-test-results/
          retention-days: 14

  candle-nnapi-tests:
    name: Candle NNAPI Build & Compile (Emulator)
    runs-on: ubuntu-latest
    # NOTE: candle-core/src/nnapi_backend contains the NNAPI backend for Android.
    # This job cross-compiles the candle-core `nnapi_tests` integration binary for
    # Android and runs it on an emulator. The `#[ignore]`d device tests require an
    # NNAPI driver; the default run confirms they report as ignored (exit 0), and a
    # second `--include-ignored` run exercises them against the emulator as a
    # non-blocking discovery step. The NNAPI backend has not yet been verified on
    # hardware — see
    # openspec/changes/fix-nnapi-supported-config-build/NOTES.md.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Install NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "ndk;30.0.16248370" \
            --sdk_root="$ANDROID_HOME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Restore Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-
            ${{ runner.os }}-cargo-

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build candle-core with nnapi feature for Android
        run: |
          cargo ndk \
            -t x86_64 \
            build -p candle-core --features nnapi \
            --tests --release 2>&1 | tail -30
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724

      - name: Find NNAPI integration test binary
        run: |
          find target/x86_64-linux-android/release/deps -maxdepth 1 -type f \
            -name "nnapi_tests-*" ! -name "*.d" 2>/dev/null | head -20
          find target/x86_64-linux-android/release/deps -maxdepth 1 -type f \
            -name "nnapi_ahb_ffi_tests-*" ! -name "*.d" 2>/dev/null | head -20

      - name: Generate emulator test script
        run: |
          cat << 'EOF' > run_nnapi_tests.sh
          #!/usr/bin/env bash
          set -e

          echo "Waiting for device..."
          adb wait-for-device

          echo "Creating test data directory..."
          adb shell mkdir -p /data/local/tmp/candle-test
          adb shell chmod 777 /data/local/tmp/candle-test

          # ── FFI smoke test (task 1.10/1.11 gate for nnapi-zero-copy-memory) ───────
          # The AHardwareBuffer zero-copy FFI layer (allocate/lock/unlock/release +
          # NNAPI memory derivation) must be proven on a device before any storage or
          # execution code is built on top of it. The previous attempt failed by skipping
          # this. cargo names this binary `nnapi_ahb_ffi_tests-<hash>`.
          echo "Locating nnapi_ahb_ffi_tests FFI smoke binary..."
          FFIBIN=$(find target/x86_64-linux-android/release/deps -maxdepth 1 -type f \
            -name "nnapi_ahb_ffi_tests-*" ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" ! -name "*.so" | head -1)

          if [ -n "$FFIBIN" ]; then
            echo "Found FFI smoke binary: $FFIBIN"
            adb push "$FFIBIN" /data/local/tmp/candle-test/nnapi_ahb_ffi_tests
            adb shell chmod +x /data/local/tmp/candle-test/nnapi_ahb_ffi_tests
            echo "== FFI smoke test (--include-ignored). Non-blocking on this emulator: =="
            echo "   aosp_atd may lack a real NNAPI driver / AHB support; a failure here is"
            echo "   a signal to run on physical hardware, which is the true 1.11 gate."
            if adb shell "cd /data/local/tmp/candle-test && TMPDIR=/data/local/tmp/candle-test ./nnapi_ahb_ffi_tests --test-threads=1 --include-ignored"; then
              echo "FFI smoke test passed on the emulator."
            else
              echo "::warning::AHB FFI smoke test failed on the emulator. The zero-copy gate (task 1.11) requires this to pass on physical hardware before nnapi-zero-copy-memory group 2 proceeds. See openspec/changes/nnapi-zero-copy-memory/NOTES.md."
            fi
          else
            echo "::warning::nnapi_ahb_ffi_tests binary not found; skipping FFI smoke test."
          fi

          echo "Locating nnapi_tests integration binary..."
          # cargo names the integration-test binary after the source file
          # (candle-core/tests/nnapi_tests.rs) as `nnapi_tests-<hash>`. Do NOT use the
          # `candle_core-<hash>` lib-test binary here: it does not contain these tests.
          TESTBIN=$(find target/x86_64-linux-android/release/deps -maxdepth 1 -type f \
            -name "nnapi_tests-*" ! -name "*.d" ! -name "*.rlib" ! -name "*.rmeta" ! -name "*.so" | head -1)

          if [ -z "$TESTBIN" ]; then
            echo "NNAPI test binary not found!"
            exit 1
          fi
          echo "Found binary: $TESTBIN"
          adb push "$TESTBIN" /data/local/tmp/candle-test/nnapi_tests
          adb shell chmod +x /data/local/tmp/candle-test/nnapi_tests

          RUNBIN="cd /data/local/tmp/candle-test && TMPDIR=/data/local/tmp/candle-test ./nnapi_tests --test-threads=1"

          # ── Phase 1 (blocking): default run must succeed. The device tests are
          # #[ignore]d, so this confirms they are registered and reported as ignored,
          # and that the binary exits 0 without a device NNAPI driver. This is the CI
          # home for task 5.4.
          echo "== Phase 1: default run (ignored tests skipped, must exit 0) =="
          adb shell "$RUNBIN"

          # ── Phase 2 (non-blocking discovery): actually execute the #[ignore]d tests
          # against the emulator's NNAPI driver. The backend has never been verified on
          # hardware, so failures here are recorded as warnings, not merge blockers.
          echo "== Phase 2: discovery run (--include-ignored, non-blocking) =="
          if adb shell "$RUNBIN --include-ignored"; then
            echo "NNAPI device tests passed on the emulator."
          else
            echo "::warning::NNAPI device tests failed under --include-ignored on the emulator. This is expected until the backend is verified on hardware; treat as discovery, not regression. See openspec/changes/fix-nnapi-supported-config-build/NOTES.md."
          fi

          echo "Testing ADB connectivity..."
          adb devices
          adb shell cat /proc/version 2>/dev/null || echo "proc/version not available"
          EOF
          chmod +x run_nnapi_tests.sh

      - uses: reactivecircus/android-emulator-runner@v2
        id: emulator
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          profile: pixel_6
          avd-name: candle-nnapi-test
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          disable-spellchecker: true
          script: ./run_nnapi_tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candle-nnapi-test-results
          path: |
            target/x86_64-linux-android/
            /tmp/candle-test-results/
          retention-days: 14

  instrumented-tests:
    name: Instrumentation Tests (Emulator)
    if: github.event_name == 'workflow_dispatch'
    needs: [build, candle-vulkan-build, candle-vulkan-tests, candle-nnapi-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        api-level:
          - ${{ github.event_name == 'workflow_dispatch' && inputs.emulator_api_level || '34' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: atheer-ffi-debug-apk
          path: android/atheer-sdk/build/outputs/apk/debug/

      - name: Download .so artifact
        uses: actions/download-artifact@v6
        with:
          name: libatheer_gpu_shard-arm64-v8a
          path: android/atheer-sdk/src/main/jniLibs/arm64-v8a/

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Create Test Execution Script ─────────────────────────────

      - name: Generate emulator script
        run: |
          cat << 'EOF' > run_instrumented_tests.sh
          #!/usr/bin/env bash
          set -e

          echo "Waiting for device..."
          adb wait-for-device

          echo "Disabling animations..."
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo "Generating test models..."
          python3 -c "
          import struct
          header = b'GGUF'
          header += struct.pack('<I', 3)
          header += struct.pack('<Q', 0)
          header += struct.pack('<Q', 0)
          with open('/tmp/test_model_corrupt.gguf', 'wb') as f:
              f.write(header)
              f.write(b'\x00' * (4096 - len(header)))
          "

          echo "Pushing test models..."
          adb push /tmp/test_model_corrupt.gguf /data/local/tmp/test_model_corrupt.gguf
          echo "placeholder" > /tmp/test_model.gguf
          adb push /tmp/test_model.gguf /data/local/tmp/test_model.gguf

          echo "Installing APK..."
          adb install -t android/atheer-sdk/build/outputs/apk/debug/atheer-sdk-debug.apk

          echo "Running connected Android tests..."
          cd android
          ./gradlew :atheer-sdk:connectedAndroidTest --no-daemon --stacktrace
          EOF

          chmod +x run_instrumented_tests.sh

      # ── Emulator ────────────────────────────────────────────────

      - uses: reactivecircus/android-emulator-runner@v2
        id: emulator
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          avd-name: atheer-test
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          disable-animations: true
          disable-spellchecker: true
          script: ./run_instrumented_tests.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-results-api-${{ matrix.api-level }}
          path: |
            android/atheer-sdk/build/reports/androidTests/
            android/atheer-sdk/build/outputs/androidTest-results/
          retention-days: 14
