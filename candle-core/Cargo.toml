[package]
name = "candle-core"
version = "0.11.0"
edition = "2021"
description = "Minimalist ML framework."
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/huggingface/candle"

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels", "candle-ug?/cuda"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:libc", "dep:intel-mkl-src"]
accelerate = ["dep:libc", "dep:accelerate-src"]
metal = ["dep:objc2-metal", "dep:objc2-foundation", "dep:candle-metal-kernels", "candle-ug?/metal"]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]
vulkan = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# NNAPI is not intended to build without Vulkan: the `Device` enum's NNAPI
# constructors (`new_nnapi`, `is_nnapi`, `as_nnapi_device`) are defined only in the
# Vulkan-gated `impl` block in src/device.rs. Declaring the dependency collapses the
# vulkan x nnapi feature space to a chain and makes `--features nnapi` alone, which
# selected an enum variant with no constructor, inexpressible.
nnapi = ["dep:libc", "vulkan"]
ug = ["dep:candle-ug"]

[dependencies]
accelerate-src = { version = "0.3.2", optional = true }
byteorder = "1.5.0"
candle-kernels = { version = "0.11.0", optional = true }
candle-metal-kernels = { version = "0.11.0", optional = true }
cudarc = { version = "0.19.9", features = ["std", "cublas", "cublaslt", "curand", "driver", "nvrtc", "f16", "f8", "cuda-version-from-build-system", "dynamic-linking"], optional = true, default-features = false }
float8 = { version = "0.7.0", features = ["num-traits", "rand_distr"] }
gemm = { version = "0.19.0", features = ["wasm-simd128-enable"] }
half = { version = "2.7.1", features = ["num-traits", "use-intrinsics", "rand_distr", "zerocopy"] }
intel-mkl-src = { version = "0.8.1", features = ["mkl-static-lp64-iomp"], optional = true }
libc = { version = "0.2.189", optional = true }
libm = "0.2.16"
memmap2 = { version = "0.9.11", features = ["stable_deref_trait"] }
num-traits = "0.2.19"
num_cpus = "1.17.0"
objc2-foundation = { version = "0.3.2", optional = true }
objc2-metal = { version = "0.3.2", optional = true }
rand = "0.9.5"
rand_distr = "0.5.1"
rayon = "1.12.0"
safetensors = "0.8.0"
thiserror = "2"
yoke = { version = "0.8.3", features = ["derive"] }
zerocopy = "0.8"
zip = { version = "8.6.0", default-features = false }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
candle-ug = { version = "0.11.0", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "30.0", features = ["vulkan-portability"], optional = true }
pollster = { version = "1.0", optional = true }
bytemuck = { version = "1.25", optional = true }

# utils.rs uses libc under bare cfg(target_os = "macos") (perf-core count via
# sysctlbyname, thread QoS elevation) with no feature gate, while the libc
# dependency above is optional (mkl/accelerate/nnapi only). Pin it on macOS
# so plain and --features metal macOS builds resolve.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { version = "0.23.2", features = ["onig"], default-features = false }

[dev-dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]
