[package]
name = "perf-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
atheer-core = { path = "../atheer-core", features = ["auto-backend"] }
atheer-accel = { path = "../atheer-accel" }
clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
criterion = { workspace = true }

[lints.cargo]
# `criterion` is only imported by the bench targets. Cargo's unused_dependencies
# lint does not account for bench-only dev-dependencies when building the
# lib/bin/test target kinds, so silence the false positive here.
unused_dependencies = "allow"

[[bench]]
name = "kv_cache_quantize"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "checkpoint"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "sustained"
harness = false

[[bench]]
name = "energy"
harness = false

[[bench]]
name = "mode_switching"
harness = false

[[bench]]
name = "thermal_throttling"
harness = false

[[bench]]
name = "thermal_response"
harness = false
