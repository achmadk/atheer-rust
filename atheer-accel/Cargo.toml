[package]
name = "atheer-accel"
version.workspace = true
edition.workspace = true

[features]
default = []
coreml = []
vulkan = []
nnapi = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

rayon = "1.12"
candle-core = "0.11.0"

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos"))'.dependencies]
# tracing is referenced only from android-gated nnapi.rs and apple-gated coreml.rs
tracing = { workspace = true }

[dev-dependencies]
# nnapi.rs #[cfg(test)] module uses tracing on all platforms (incl. Linux)
tracing = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
candle-core = { version = "0.11.0", features = ["metal"] }
sysctl = "0.7"
candle-coreml = { path = "../candle-coreml" }

[target.'cfg(target_os = "android")'.dependencies]
candle-core = { version = "0.11.0", features = ["vulkan", "nnapi"] }
ash = { workspace = true }
gpu-allocator = { workspace = true }
bytemuck = "1.25"

[build-dependencies]
naga = { workspace = true }
